apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: acm-models-maas
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # Sites that run MaaS: role ingress or combined (apps/ai-grid-spokes).
    - clusterDecisionResource:
        configMapRef: acm-placement
        labelSelector:
          matchLabels:
            cluster.open-cluster-management.io/placement: ai-grid-ingress
  syncPolicy:
    applicationsSync: sync
    preserveResourcesOnDeletion: false
  template:
    metadata:
      name: 'acm-models-maas-{{.name}}'
      namespace: openshift-gitops
    spec:
      project: default
      source:
        repoURL: https://github.com/rareddy/ai-grid-cluster-gitops.git
        targetRevision: aws-osd
        path: apps/acm-models/maas
        directory:
          recurse: true
      destination:
        # Use the hub API directly; remote sites retain their ACM proxy endpoint.
        server: '{{ if eq .name "local-cluster" }}https://kubernetes.default.svc{{ else }}{{ .server }}{{ end }}'
        namespace: models-as-a-service
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
