apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: rhoai-prerequisites-clusters
  namespace: rhoai-prerequisites
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  clusterSets:
    - global
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: rhoai-prerequisites-remote-clusters
  namespace: rhoai-prerequisites
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  clusterSets:
    - global
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            ai-grid/enabled: "true"
          matchExpressions:
            # Shared MaaS counters belong only to consumer-facing sites.
            - key: ai-grid/role
              operator: In
              values:
                - ingress
                - combined
            - key: name
              operator: NotIn
              values:
                - local-cluster
            # The MaaS home runs Redis itself (apps/maas-home).
            - key: ai-grid/maas-home
              operator: NotIn
              values:
                - "true"
